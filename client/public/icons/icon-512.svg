<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="auraBg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#0f0720"/>
      <stop offset="100%" stop-color="#07040d"/>
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#auraBg)"/>
  <circle cx="256" cy="256" r="190" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.3" fill="none"/>
  <circle cx="256" cy="256" r="140" stroke="url(#neonGrad)" stroke-width="8" stroke-dasharray="16 12" stroke-opacity="0.5" fill="none"/>
  
  <!-- Aura Music Symbol (Letter A + Vinyl + Sound Waves) -->
  <g filter="url(#glow)">
    <!-- Stylized Music Wave / A -->
    <path d="M160 350 L256 140 L352 350" stroke="url(#neonGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M195 285 L317 285" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- Glowing core note -->
    <circle cx="256" cy="225" r="28" fill="url(#neonGrad)"/>
    <path d="M256 225 L256 175 C290 175 305 195 315 210" stroke="url(#neonGrad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</svg>